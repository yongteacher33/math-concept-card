<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초강스 LAB · 3문항 미니 진단</title><style>
body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f2f7f8;color:#18333c;margin:0;padding:14px}main{max-width:760px;margin:auto}header,.card{background:white;border:1px solid #d8e4e7;border-radius:16px;padding:18px;margin:12px 0}header{background:#123b48;color:white}h1{font-size:1.45rem}label{display:block;margin:10px 0 5px;font-weight:600}input[type=text],textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #b9cbd0;border-radius:9px;font:inherit}textarea{min-height:60px}.opt{display:flex;gap:8px;padding:10px;border:1px solid #d8e4e7;border-radius:9px;font-weight:400}button{padding:11px 14px;border:0;border-radius:9px;background:#176b7d;color:white;font-weight:700;margin:5px 4px 0 0;cursor:pointer}.secondary{background:#e6eff1;color:#18333c}.notice{background:#edf4f5;padding:12px;border-radius:9px;margin-top:10px}small{color:#637983}@media(max-width:500px){body{padding:8px}.card,header{padding:13px}button{width:100%}}:focus-visible{outline:3px solid #d99b24;outline-offset:2px}</style><main>
<header><small style="color:#d8e8eb">초강스 에듀테크 LAB · 6주차 초보</small><h1>3문항 미니 진단</h1><p>풀이보다 먼저 생각을 확인해요. 점수만으로 학생의 능력을 단정하지 않습니다.</p></header>
<section class="card"><h2>도입 카드</h2><label for="nick">별명 (실제 이름은 쓰지 마세요)</label><input id="nick" value="[내 별명]" maxlength="30"><label for="intro">도입 질문</label><textarea id="intro">닫힌구간에서 이차함수의 최댓값과 최솟값을 찾으려면 무엇을 확인해야 할까요?</textarea></section>
<form id="quiz"><section class="card"><h2>1. 후보 x</h2><p>f(x)=2(x−2)²−1, 구간 [2,4]입니다. 비교할 후보 x를 고르세요.</p><label class="opt"><input type="radio" name="q1" value="a"> x=2, 4</label><label class="opt"><input type="radio" name="q1" value="b"> x=2만</label><label class="opt"><input type="radio" name="q1" value="c"> x=1, 2, 3</label><label>이유</label><textarea id="r1" placeholder="왜 이 후보를 골랐나요?"></textarea></section>
<section class="card"><h2>2. 최솟값</h2><p>f(x)=2(x−2)²−1, 구간 [2,4]에서 최솟값은?</p><label class="opt"><input type="radio" name="q2" value="a"> 7</label><label class="opt"><input type="radio" name="q2" value="b"> −1</label><label class="opt"><input type="radio" name="q2" value="c"> 3</label><label>이유</label><textarea id="r2" placeholder="왜 가장 작다고 생각했나요?"></textarea></section>
<section class="card"><h2>3. 최댓값</h2><p>같은 함수와 구간에서 최댓값은?</p><label class="opt"><input type="radio" name="q3" value="a"> −1</label><label class="opt"><input type="radio" name="q3" value="b"> 5</label><label class="opt"><input type="radio" name="q3" value="c"> 7</label><label>이유</label><textarea id="r3" placeholder="함숫값을 어떻게 비교할지 적어 보세요."></textarea></section>
<section class="card"><h2>응답 저장</h2><small>응답은 브라우저에서 처리됩니다. 실제 이름·성적·연락처를 입력하지 마세요.</small><br><button type="submit">응답 확인 및 이 기기에 저장</button><button type="button" class="secondary" id="copy">요약 복사</button><button type="button" class="secondary" id="download">JSON 파일 저장</button><button type="button" class="secondary" id="reset">선택 초기화</button><div id="status" class="notice" role="status">아직 확인하지 않았습니다.</div><textarea id="fallback" hidden aria-label="수동 복사 텍스트"></textarea></section></form></main>
<script>
const $=x=>document.getElementById(x);function data(){return {nickname:$('nick').value.trim()||'[내 별명]',prompt:$('intro').value,answers:[1,2,3].map(i=>({question:i,choice:document.querySelector('input[name=q'+i+']:checked')?.parentElement.innerText.trim()||'미선택',reason:$('r'+i).value}))}}function summary(){let d=data();return '초강스 LAB 3문항 미니 진단\n별명: '+d.nickname+'\n도입 질문: '+d.prompt+'\n'+d.answers.map(a=>a.question+'번: '+a.choice+'\n이유: '+(a.reason||'미작성')).join('\n')}
$('quiz').onsubmit=e=>{e.preventDefault();localStorage.setItem('chogang-mini-diagnostic-response',JSON.stringify(data()));$('status').textContent='응답을 이 기기에 저장했습니다. 이유를 듣고 설명·활동을 선택하세요.'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());$('status').textContent='복사했습니다.';$('fallback').hidden=true}catch(e){$('fallback').hidden=false;$('fallback').value=summary();$('fallback').focus();$('fallback').select();$('status').textContent='자동 복사 실패. 아래 텍스트를 선택하고 Ctrl+C를 누르세요.'}};
$('download').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='anonymous-mini-diagnostic.json';a.click();URL.revokeObjectURL(u)};
$('reset').onclick=()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);[1,2,3].forEach(i=>$('r'+i).value='');$('status').textContent='선택과 이유를 초기화했습니다.'};
</script></html>
