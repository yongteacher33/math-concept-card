<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초강스 LAB · 교사용 진단</title><style>
body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f2f7f8;color:#18333c;margin:0;padding:14px}main{max-width:960px;margin:auto}header,.card{background:white;border:1px solid #d8e4e7;border-radius:16px;padding:18px;margin:12px 0}header{background:#123b48;color:white}h1{font-size:1.4rem}label{display:block;margin:9px 0 5px;font-weight:600}input,select,textarea{font:inherit;padding:9px;border:1px solid #b9cbd0;border-radius:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.grid label select{width:100%}button{padding:11px 14px;border:0;border-radius:9px;background:#176b7d;color:white;font-weight:700;margin:5px 4px 0 0;cursor:pointer}.secondary{background:#e6eff1;color:#18333c}.notice{background:#edf4f5;padding:12px;border-radius:9px;margin-top:10px}svg{width:100%;background:white;border:1px solid #d8e4e7;border-radius:10px}small{color:#637983}@media(max-width:500px){body{padding:8px}.card,header{padding:13px}button{width:100%}}:focus-visible{outline:3px solid #d99b24;outline-offset:2px}</style><main><header><small style="color:#d8e8eb">초강스 에듀테크 LAB · 6주차</small><h1>3문항 미니 진단 — 교사용</h1><p>제한된 구간에서 양 끝점과 구간 안의 꼭짓점 후보를 직접 대입해 비교합니다.</p></header>
<section class="card"><h2>조건 설정</h2><div class="grid"><label>a<select id="a"><option>1</option><option selected>2</option><option>3</option></select></label><label>h<select id="h"></select></label><label>k<select id="k"></select></label><label>왼쪽 끝 L<select id="L"></select></label><label>오른쪽 끝 R<select id="R"></select></label></div><label>별명</label><input id="nick" value="[내 별명]"><label>도입 질문</label><textarea id="intro">닫힌구간에서 이차함수의 최댓값과 최솟값을 찾으려면 무엇을 확인해야 할까요?</textarea><button id="apply">조건 적용 / 선택·공개 초기화</button><button class="secondary" id="example">기본 예시</button><div id="cfg" class="notice">기본 예시: f(x)=2(x−2)²−1, [2,4]</div></section>
<section class="card"><h2>문항</h2><div id="qs" class="grid"></div><button id="check">선택 확인 및 해설 공개</button><button class="secondary" id="clear">선택·확인 초기화</button><div id="result" class="notice" aria-live="polite">확인 전에는 정답을 공개하지 않습니다.</div></section>
<section class="card"><h2>그래프</h2><p id="formula"></p><svg id="graph" viewBox="0 0 600 300" role="img" aria-label="이차함수 그래프"></svg><div id="audit" hidden></div></section>
<section class="card"><h2>익명 응답 및 수업 메모</h2><label>학생용 JSON 불러오기</label><input type="file" id="file" accept=".json,application/json"><div id="responses" class="notice">응답 파일을 불러오지 않았습니다.</div><label>교사 메모 (예: 후보는 찾지만 함숫값 비교를 생략함 → 비교표 활동)</label><textarea id="memo"></textarea><button id="save">수업 계획 저장</button><button id="export" class="secondary">계획·검산 내보내기</button><button id="copy" class="secondary">요약 복사</button><div id="status" class="notice" role="status">브라우저 로컬 저장을 사용합니다.</div><textarea id="fallback" hidden aria-label="수동 복사 텍스트"></textarea></section></main>
<script>
const $=x=>document.getElementById(x),range=(l,r)=>Array.from({length:r-l+1},(_,i)=>i+l),fmt=n=>n<0?'−'+Math.abs(n):''+n;
function fill(id,vals,v){$(id).innerHTML=vals.map(n=>'<option value="'+n+'" '+(n===v?'selected':'')+'>'+fmt(n)+'</option>').join('')}fill('h',range(-3,3),2);fill('k',range(-3,3),-1);fill('L',range(-4,4),2);fill('R',range(-4,4),4);
let s={a:2,h:2,k:-1,L:2,R:4,shown:false};const f=x=>s.a*(x-s.h)**2+s.k,expr=()=> 'f(x)='+s.a+'(x−('+fmt(s.h)+'))²'+(s.k<0?'−'+Math.abs(s.k):'+'+s.k);
function calc(){let xs=[s.L,s.R];if(s.h>=s.L&&s.h<=s.R)xs.push(s.h);xs=[...new Set(xs)];let vals=xs.map(x=>({x,y:f(x)}));return {vals,min:Math.min(...vals.map(v=>v.y)),max:Math.max(...vals.map(v=>v.y)),xs}}
function render(){let c=calc(),opts=[c.xs.map(fmt).join(', '),fmt(c.min),fmt(c.max)];let distract=[[c.xs.map(fmt).join(', '),s.L+', '+s.R,'구간 안의 모든 정수'],[fmt(c.max),fmt(c.min),fmt(c.min+2)],[fmt(c.min),fmt(c.max-2),fmt(c.max)]];
$('qs').innerHTML=[['1. 후보 x','양 끝점과 구간 안의 꼭짓점 중 비교할 후보 x는?',0],['2. 최솟값','구간에서 최솟값은?',1],['3. 최댓값','구간에서 최댓값은?',2]].map((q,i)=>{let arr=distract[i],shift=((s.a+s.h+s.k+s.L+s.R+i)%3+3)%3;arr=arr.slice(shift).concat(arr.slice(0,shift));return '<div><h3>'+q[0]+'</h3><p>'+q[1]+'</p>'+arr.map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join('')+'<label>이유</label><textarea id="r'+i+'" placeholder="선택 이유"></textarea><div id="e'+i+'" class="notice" hidden></div></div>'}).join('');draw(false);$('formula').textContent=expr()+' · 구간 ['+fmt(s.L)+','+fmt(s.R)+']'}
function draw(show){let svg=$('graph'),W=600,H=300,p=35,x0=Math.min(-4,s.L,s.h)-1,x1=Math.max(4,s.R,s.h)+1,ys=range(x0,x1).map(f),y0=Math.min(...ys)-2,y1=Math.max(...ys)+2,X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p),z='';for(let x=Math.ceil(x0);x<=x1;x++)z+='<line x1="'+X(x)+'" y1="'+p+'" x2="'+X(x)+'" y2="'+(H-p)+'" stroke="#edf1f2"/><text x="'+X(x)+'" y="'+(H-p+15)+'" text-anchor="middle" font-size="10">'+x+'</text>';let d='';for(let i=0;i<=200;i++){let x=x0+(x1-x0)*i/200;d+=(i?'L':'M')+X(x)+','+Y(f(x))+' '}z+='<path d="'+d+'" fill="none" stroke="#176b7d" stroke-width="3"/><line x1="'+X(s.L)+'" y1="'+p+'" x2="'+X(s.L)+'" y2="'+(H-p)+'" stroke="#d69b27" stroke-dasharray="4 4"/><line x1="'+X(s.R)+'" y1="'+p+'" x2="'+X(s.R)+'" y2="'+(H-p)+'" stroke="#d69b27" stroke-dasharray="4 4"/><text x="300" y="18" text-anchor="middle" font-size="13">'+expr()+' ['+fmt(s.L)+','+fmt(s.R)+']</text><circle cx="'+X(s.L)+'" cy="'+Y(f(s.L))+'" r="5" fill="#d69b27"/><circle cx="'+X(s.R)+'" cy="'+Y(f(s.R))+'" r="5" fill="#d69b27"/>';if(show&&s.h>=s.L&&s.h<=s.R)z+='<circle cx="'+X(s.h)+'" cy="'+Y(s.k)+'" r="6" fill="#c74444"/>';svg.innerHTML=z}
function clear(){s.shown=false;document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);[0,1,2].forEach(i=>{ $('e'+i).hidden=true;$('e'+i).textContent=''});$('audit').hidden=true;$('result').textContent='선택과 확인 결과를 초기화했습니다.';render()}
$('apply').onclick=()=>{let L=+$('L').value,R=+$('R').value;if(L>=R){$('cfg').textContent='오류: 왼쪽 끝은 오른쪽 끝보다 작아야 합니다.';return}s={a:+$('a').value,h:+$('h').value,k:+$('k').value,L,R,shown:false};clear();$('cfg').textContent='조건 적용 완료. 선택·공개 결과를 초기화했습니다.'};
$('example').onclick=()=>{ $('a').value=2;fill('h',range(-3,3),2);fill('k',range(-3,3),-1);fill('L',range(-4,4),2);fill('R',range(-4,4),4);$('intro').value='닫힌구간에서 이차함수의 최댓값과 최솟값을 찾으려면 무엇을 확인해야 할까요?';$('apply').click()};
$('check').onclick=()=>{let c=calc(),answers=[c.xs.map(fmt).join(', '),fmt(c.min),fmt(c.max)],correct=0;[0,1,2].forEach(i=>{let pick=document.querySelector('input[name=q'+i+']:checked'),ex=$('e'+i);ex.hidden=false;let choices=[...document.querySelectorAll('input[name=q'+i+']')].map(x=>x.parentElement.textContent.trim());if(!pick){ex.textContent='미선택. ';return}if(choices[+pick.value]===answers[i])correct++;ex.textContent=(choices[+pick.value]===answers[i]?'정답입니다. ':'다른 후보도 비교해 보세요. ')+(i===0?'끝점은 항상 확인하고, 꼭짓점은 구간 안에 있을 때 후보에 포함합니다.':i===1?'후보 함숫값: '+c.vals.map(v=>'f('+fmt(v.x)+')='+fmt(v.y)).join(', ')+'. 최솟값은 '+fmt(c.min)+'.':'후보 함숫값: '+c.vals.map(v=>'f('+fmt(v.x)+')='+fmt(v.y)).join(', ')+'. 최댓값은 '+fmt(c.max)+'.')});s.shown=true;draw(true);$('result').textContent='응답을 확인했습니다. 정답 수는 학생 능력의 단정적 지표가 아닙니다. 이유를 함께 살펴보세요.';$('audit').hidden=false;$('audit').innerHTML='<h3>교사용 검산</h3><p>'+c.vals.map(v=>'x='+fmt(v.x)+' → f(x)='+fmt(v.y)).join(' / ')+'</p><p>최솟값 '+fmt(c.min)+' · 최댓값 '+fmt(c.max)+' · 꼭짓점 x='+fmt(s.h)+'은 '+(s.h<s.L||s.h>s.R?'구간 밖':s.h===s.L||s.h===s.R?'경계':'구간 안')+'</p>'};
$('clear').onclick=clear;
$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());$('responses').textContent=(d.answers||d.responses||[]).map(a=>a.question+'번: '+(a.choice||'미선택')+' / 이유: '+(a.reason||'미작성')).join(' · ')||'응답 항목이 없습니다.'}catch(x){$('responses').textContent='JSON 파일을 읽지 못했습니다.'}};
function plan(){let c=calc();return {nickname:$('nick').value,prompt:$('intro').value,condition:{...s,expression:expr()},verification:c,teacherMemo:$('memo').value,studentResponses:$('responses').textContent}}
$('save').onclick=()=>{localStorage.setItem('chogang-mini-diagnostic-plan',JSON.stringify(plan()));$('status').textContent='수업 계획을 이 브라우저에 저장했습니다.'};
$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(plan(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='teacher-mini-diagnostic-plan.json';a.click();URL.revokeObjectURL(u)};
$('copy').onclick=async()=>{let t=JSON.stringify(plan(),null,2);try{await navigator.clipboard.writeText(t);$('status').textContent='복사했습니다.'}catch(e){$('fallback').hidden=false;$('fallback').value=t;$('fallback').focus();$('fallback').select();$('status').textContent='자동 복사 실패. 아래 텍스트를 선택하고 Ctrl+C를 누르세요.'}};render();
</script></html>
